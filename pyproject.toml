[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "nth-dao"
version = "0.10.0b1"
description = "AI-native Web3 DAO layer for humans and agents"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "AlexNthLab" }]
license = "MIT"
license-files = ["LICENSE"]
keywords = [
    "agent", "multi-agent", "dao", "web3", "ai", "claude", "hermes",
    "blackboard", "mission", "evolution", "identity", "a2a",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # License classifier removed; modern SPDX `license` field replaces it (PEP 639)
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Zero third-party deps for core functionality.
# All NTH DAO core functionality uses only Python stdlib.
dependencies = []

[project.optional-dependencies]
# Optional extensions:
dev = [
    "pytest>=7.0",
    "ruff>=0.1.0",
    "mypy>=1.0",
    "jsonschema>=4.22",
]
contracts = ["pydantic>=2.0"]    # stricter EvoLoop contract validation
retries = ["tenacity>=8.0"]      # better retry primitives in generated skills
crypto = ["pynacl>=1.5"]         # optional Ed25519 agent identity/signing
lan = ["zeroconf>=0.131"]        # optional mDNS/Bonjour LAN discovery backend
p2p = ["websockets>=13.0,<17.0"] # optional signed WebSocket gossip transport
trade-validation = ["jsonschema>=4.22"] # execute Rule Hook JSON Schemas
ux = ["qrcode[pil]>=7.4"]        # optional QR code rendering for invitations

nostr = ["nostr-sdk>=0.45,<0.46"] # optional Nostr relay tier (Phase 2)

# Backend-specific (only install what you use):
anthropic = ["anthropic>=0.40.0"]
claude = [
    "anthropic>=0.40.0",
    "pywinpty>=3.0.5; platform_system == 'Windows'",
]
claude-cli = ["pywinpty>=3.0.5; platform_system == 'Windows'"]
openai = ["openai>=1.0.0"]
google = ["google-generativeai>=0.3.0"]
hermes = []  # via subprocess; install hermes-agent separately
web = ["fastapi>=0.100", "uvicorn>=0.20"]  # nth_dao.web local console

[project.urls]
Homepage = "https://github.com/AlexNthLab/nth-dao"
Documentation = "https://github.com/AlexNthLab/nth-dao#readme"
Issues = "https://github.com/AlexNthLab/nth-dao/issues"
Changelog = "https://github.com/AlexNthLab/nth-dao/blob/main/CHANGELOG.md"

[project.scripts]
nth-web = "nth_dao.web:main"
nth-status = "nth_dao.cli.status:main"
nth-metrics = "nth_dao.cli.metrics:main"

[tool.setuptools]
# Package membership comes from importable packages, not a manually maintained
# list. Keeping this declarative prevents newly added protocol layers from
# silently disappearing from wheels.
include-package-data = false

[tool.setuptools.packages.find]
where = ["."]
include = ["nth_dao*", "team_layer*"]
exclude = ["tests*", "examples*"]
namespaces = false

# Optional package data: include INTEGRATION_GUIDE inside nth_dao/
[tool.setuptools.package-data]
"nth_dao" = ["INTEGRATION_GUIDE.md"]
"nth_dao.conformance" = ["vectors.json"]
"nth_dao.market" = ["vectors/*.json"]
"nth_dao.plugins" = ["vectors/*.json"]
"nth_dao.trade_rules" = ["schemas/*.json", "vectors/*.json"]
"nth_dao.web" = ["static/*.html", "static/*.svg", "static/assets/*"]

[tool.setuptools.exclude-package-data]
"*" = [".gitignore", ".gitkeep", "__pycache__/*", "*.pyc"]
